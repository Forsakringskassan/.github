name: Publish release on tag push

on:
  workflow_call:
    inputs:
      version:
        description: >-
          Versionen (taggen) att skapa release för. Skicka med den när anroparen
          vet den, t.ex. från generic-conventional-release. Utan den används
          versionen i Maven-stagingen, annars högsta versionstaggen.
        required: false
        type: string
        default: ''

jobs:
  publish-github-release-from-latest-tag:
    runs-on: "ubuntu-latest"
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-tags: "true"
          fetch-depth: "0"
          persist-credentials: false

      # Workflowet används även av appar och tjänster. Med pattern i stället för
      # name ger en saknad artefakt inget fel, medan andra fel stoppar jobbet.
      - name: Fetch Maven staging
        uses: actions/download-artifact@v8
        with:
          pattern: maven-staging
          merge-multiple: true
          path: ${{ runner.temp }}/maven-staging

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -f "$RUNNER_TEMP/maven-staging/release-version.txt" ]; then
            HAS_STAGING=true
            ASSETS=("$RUNNER_TEMP/maven-staging/maven-staging.tar.gz")
          else
            HAS_STAGING=false
            ASSETS=()
          fi

          # Versionen i turordning: input, Maven-staging, högsta versionstagg.
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$INPUT_VERSION"
          elif [ "$HAS_STAGING" = "true" ]; then
            TAG="$(cat "$RUNNER_TEMP/maven-staging/release-version.txt")"
          else
            # Sortera på versionsnumret utan ledande "v", men behåll taggens namn.
            TAG="$(git tag --list | grep -E '^v?[0-9]+\.[0-9]+\.[0-9]+$' \
              | awk '{ v = $0; sub(/^v/, "", v); print v "\t" $0 }' \
              | sort -t $'\t' -k1,1V | tail -n 1 | cut -f2)"
          fi
          [ -n "$TAG" ] || { echo "::error::Hittade ingen version att skapa release för"; exit 1; }
          echo "Release för $TAG"

          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Releasen $TAG finns redan, uppdaterar tillgångar"
            if [ ${#ASSETS[@]} -gt 0 ]; then
              gh release upload "$TAG" "${ASSETS[@]}" -R "$GITHUB_REPOSITORY" --clobber
            fi
          else
            gh release create "$TAG" "${ASSETS[@]}" -R "$GITHUB_REPOSITORY" \
              --verify-tag --generate-notes --title "$TAG"
          fi

          if [ "$HAS_STAGING" = "true" ]; then
            echo "::notice::Starta intaget: gh workflow run maven-intake.yaml -R Forsakringskassan/repository -f repo=${GITHUB_REPOSITORY#*/} -f tag=$TAG"
          fi
