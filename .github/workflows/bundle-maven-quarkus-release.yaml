name: Bundle Maven Quarkus Release

on:
  workflow_call:
    secrets:
      # Används inte längre. Kvar som valfria tills anropare slutat skicka dem.
      PACKAGES_RW_ACTOR:
        required: false
      PACKAGES_RW_TOKEN:
        required: false

jobs:
  call-app-generic-conventional-release:
    if: |
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/master'
    uses: $/.github/workflows/generic-conventional-release.yaml

  call-app-maven-docker-quarkus:
    if: |
      needs.call-app-generic-conventional-release.outputs.is-new-version == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [call-app-generic-conventional-release]
    uses: $/.github/workflows/app-maven-docker-quarkus.yaml
    with:
      release: true
      version: ${{ needs.call-app-generic-conventional-release.outputs.current-version }}

  publish-release:
    if: |
      needs.call-app-generic-conventional-release.outputs.is-new-version == 'true' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [call-app-generic-conventional-release, call-app-maven-docker-quarkus]
    uses: $/.github/workflows/publish-release-on-tag-push.yaml
    with:
      version: ${{ needs.call-app-generic-conventional-release.outputs.current-version }}
