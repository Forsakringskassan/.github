---
# Runs in THIS repository only. Not reusable.
#
# The workflows here are the CI environment for the whole organisation, so a
# mistake lands in every repository at once. This guards the structure.
name: Self lint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier
        run: npm run prettier:check

      - name: Check workflow structure
        if: success() || failure()
        run: npm run check-workflows
