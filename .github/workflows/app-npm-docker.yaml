---
# INTERNAL building block -- not part of the public API.
# Repositories should call one of the bundle-*.yaml workflows instead.
# See docs/internals.md.
name: Build NPM app into Docker image

on:
  workflow_call:
    inputs:
      version:
        description: Version to tag the image with when `release` is true.
        required: true
        type: string
      release:
        description: >-
          Push the `<version>` and `latest` tags in addition to `snapshot`.
        required: true
        type: boolean
      registry:
        description: Container registry to push to.
        required: false
        type: string
        default: ghcr.io
      runtime-env:
        description: >-
          Ship a `runtime-config.js` placeholder and make the web root writable
          by an arbitrary OpenShift UID, so that configuration can be injected
          at runtime through a mounted ConfigMap.
        required: false
        type: boolean
        default: false
      node-version:
        description: Node.js version used to build the app.
        required: false
        type: string
        default: 24.x
    secrets:
      PACKAGES_RW_ACTOR:
        required: true
      PACKAGES_RW_TOKEN:
        required: true

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get and sanitize package name
        id: pkg
        run: |
          set -euo pipefail
          raw_name=$(node -p "require('./package.json').name")
          clean_name=$(echo "$raw_name" | tr -d '@' | tr '/' '-')
          echo "name=$clean_name" >> "$GITHUB_OUTPUT"
          echo "Package name: $raw_name -> $clean_name"

      - name: Build project
        run: npm run build
        env:
          APP_BASE_PATH: false

      - name: Create runtime-config.js placeholder
        if: inputs.runtime-env
        run: |
          cat > dist/runtime-config.js <<'EOF'
          // Runtime environment -- override via Kubernetes ConfigMap.
          window.__env = {};
          EOF

      - name: Prepare Docker context
        env:
          RUNTIME_ENV: ${{ inputs.runtime-env }}
        run: |
          set -euo pipefail
          mkdir docker
          cp -r dist docker/

          # Apache runs as a non-root user. With runtime-env the web root is
          # made group-writable for gid 0 instead of owned by www-data, which
          # is what OpenShift needs when it assigns an arbitrary UID.
          if [ "$RUNTIME_ENV" = "true" ]; then
            cat > docker/permissions.txt <<'EOF'
          RUN chgrp -R 0 /usr/local/apache2/htdocs && \
              chmod -R g=u /usr/local/apache2/htdocs && \
              usermod -a -G 0 www-data
          EOF
          else
            cat > docker/permissions.txt <<'EOF'
          RUN chown -R www-data:www-data /usr/local/apache2/htdocs && \
              chmod -R 755 /usr/local/apache2/htdocs
          EOF
          fi

          cat > docker/start-httpd.sh <<'EOF'
          #!/bin/bash
          PORT=${HTTPD_PORT:-8080}
          cp /usr/local/apache2/conf/httpd.conf /tmp/httpd.conf
          sed -i "s/Listen 80/Listen $PORT/" /tmp/httpd.conf
          sed -i "s|ErrorLog logs/error_log|ErrorLog /tmp/apache2/logs/error_log|" /tmp/httpd.conf
          sed -i "s|CustomLog logs/access_log|CustomLog /tmp/apache2/logs/access_log|" /tmp/httpd.conf
          sed -i "s|#PidFile logs/httpd.pid|PidFile /tmp/apache2/run/httpd.pid|" /tmp/httpd.conf
          echo "PidFile /tmp/apache2/run/httpd.pid" >> /tmp/httpd.conf
          echo "ServerName localhost" >> /tmp/httpd.conf
          echo "Starting container: $IMAGE_NAME"
          echo "Version: $NEXT_VERSION"
          echo "Commit: $GIT_COMMIT"
          echo "Build date: $BUILD_DATE"
          echo "Listening on port: $PORT"
          echo ""
          exec httpd -D FOREGROUND -f /tmp/httpd.conf
          EOF

          cat > docker/Dockerfile <<'EOF'
          FROM httpd:latest
          USER 0

          RUN rm -rf /usr/local/apache2/htdocs/*

          # Runtime configuration, when used, is injected by mounting a
          # ConfigMap over /usr/local/apache2/htdocs/runtime-config.js
          COPY dist/ /usr/local/apache2/htdocs/
          COPY start-httpd.sh /usr/local/bin/start-httpd.sh

          ARG NEXT_VERSION
          ARG GIT_COMMIT
          ARG IMAGE_NAME
          ARG BUILD_DATE
          ENV NEXT_VERSION=$NEXT_VERSION
          ENV GIT_COMMIT=$GIT_COMMIT
          ENV IMAGE_NAME=$IMAGE_NAME
          ENV BUILD_DATE=$BUILD_DATE
          ENV HTTPD_PORT=8080

          RUN mkdir -p /tmp/apache2/logs /tmp/apache2/run && \
              chmod -R 777 /tmp/apache2 && \
              chmod +x /usr/local/bin/start-httpd.sh
          EOF

          cat docker/permissions.txt >> docker/Dockerfile
          rm docker/permissions.txt

          cat >> docker/Dockerfile <<'EOF'

          USER www-data
          EXPOSE 8080
          CMD ["/usr/local/bin/start-httpd.sh"]
          EOF

          echo "--- generated Dockerfile ---"
          cat docker/Dockerfile

      - name: Log in to registry
        run: |
          echo "${{ secrets.PACKAGES_RW_TOKEN }}" \
            | docker login "${{ inputs.registry }}" \
                -u "${{ secrets.PACKAGES_RW_ACTOR }}" --password-stdin

      - name: Build and push image
        uses: Forsakringskassan/.github/actions/docker-build-push@main
        with:
          image: >-
            ${{ inputs.registry }}/forsakringskassan/${{ steps.pkg.outputs.name }}
          version: ${{ inputs.version }}
          release: ${{ inputs.release }}
          context: docker
          description: "NPM application: ${{ steps.pkg.outputs.name }}"
