name: Bundle Maven Quarkus CI

on:
  workflow_call:
    secrets:
      PACKAGES_RW_ACTOR:
        required: true
      PACKAGES_RW_TOKEN:
        required: true

jobs:
  call-maven-ci:
    uses: $/.github/workflows/maven-ci.yaml
    secrets:
      PACKAGES_RW_ACTOR: ${{ secrets.PACKAGES_RW_ACTOR }}
      PACKAGES_RW_TOKEN: ${{ secrets.PACKAGES_RW_TOKEN }}

  call-app-maven-docker-quarkus:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [call-maven-ci]
    uses: $/.github/workflows/app-maven-docker-quarkus.yaml
    with:
      release: false
      version: snapshot
    secrets:
      PACKAGES_RW_ACTOR: ${{ secrets.PACKAGES_RW_ACTOR }}
      PACKAGES_RW_TOKEN: ${{ secrets.PACKAGES_RW_TOKEN }}
      
  call-pnr-scan:
    uses: $/.github/workflows/pnr-scanner.yaml
