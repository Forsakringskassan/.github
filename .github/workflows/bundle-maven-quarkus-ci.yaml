name: Bundle Maven Quarkus CI

on:
  workflow_call:
    secrets:
      # Används inte längre. Kvar som valfria tills anropare slutat skicka dem.
      PACKAGES_RW_ACTOR:
        required: false
      PACKAGES_RW_TOKEN:
        required: false

jobs:
  call-maven-ci:
    uses: $/.github/workflows/maven-ci.yaml

  call-app-maven-docker-quarkus:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    needs: [call-maven-ci]
    uses: $/.github/workflows/app-maven-docker-quarkus.yaml
    with:
      release: false
      version: snapshot
      
  call-pnr-scan:
    uses: $/.github/workflows/pnr-scanner.yaml
