name: actionlint

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: kjanat/actionlint@v1
        with:
          plugin-cache: false
        env:
          # Välj bort style & info, tills vidare
          SHELLCHECK_OPTS: "--severity=warning"
