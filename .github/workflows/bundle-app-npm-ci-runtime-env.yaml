name: Bundle App NPM CI with runtime-env

on:
  workflow_call:
    secrets:
      # Används inte längre. Kvar som valfria tills anropare slutat skicka dem.
      PACKAGES_RW_ACTOR:
        required: false
      PACKAGES_RW_TOKEN:
        required: false

jobs:
  call-npm-ci:
    uses: $/.github/workflows/npm-ci.yaml
  call-app-npm-docker:
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    needs: call-npm-ci
    uses: $/.github/workflows/app-npm-docker-runtime-env.yaml
    with:
      release: false
      version: snapshot
  call-npm-ghpages-app:
    needs: call-app-npm-docker
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    uses: $/.github/workflows/npm-ghpages-app.yaml
  call-pnr-scan:
    uses: $/.github/workflows/pnr-scanner.yaml
