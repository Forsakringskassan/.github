name: Bundle Gradle CI

on:
  workflow_call:
    secrets:
      PACKAGES_RW_ACTOR:
        required: true
      PACKAGES_RW_TOKEN:
        required: true

jobs:
  call-gradle-ci:
    uses: $/.github/workflows/gradle-ci.yaml
    secrets:
      PACKAGES_RW_ACTOR: ${{ secrets.PACKAGES_RW_ACTOR }}
      PACKAGES_RW_TOKEN: ${{ secrets.PACKAGES_RW_TOKEN }}
  call-pnr-scan:
    uses: $/.github/workflows/pnr-scanner.yaml
