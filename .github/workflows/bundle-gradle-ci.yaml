name: Bundle Gradle CI

on:
  workflow_call:
    secrets:
      # Används inte längre. Kvar som valfria tills anropare slutat skicka dem.
      PACKAGES_RW_ACTOR:
        required: false
      PACKAGES_RW_TOKEN:
        required: false

jobs:
  call-gradle-ci:
    uses: $/.github/workflows/gradle-ci.yaml
  call-pnr-scan:
    uses: $/.github/workflows/pnr-scanner.yaml
