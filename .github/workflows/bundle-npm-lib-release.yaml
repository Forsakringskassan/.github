---
# PUBLIC API -- other repositories call this workflow. Changing its inputs,
# secrets or job names is a breaking change for them. See ../../README.md.
name: Bundle npm lib release

on:
  workflow_call:
    inputs:
      app-id:
        description: >-
          Client ID of the GitHub App that authors the release commit,
          normally `vars.RELEASE_APP_ID`.
        required: true
        type: string
      node-version:
        description: Node.js version used to build the release.
        required: false
        type: string
        default: 24.x
      config-preset:
        description: >-
          semantic-release config preset. Empty means automatic detection.
        required: false
        type: string
        default: ""
      build-command:
        description: Command run to build the package before releasing it.
        required: false
        type: string
        default: npm run --if-present build
    secrets:
      app-key:
        description: Private key of the GitHub App given in `app-id`.
        required: true

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Create app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.app-key }}

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up
        uses: Forsakringskassan/.github/actions/npm-setup@main
        with:
          node-version: ${{ inputs.node-version }}

      - name: Release
        uses: Forsakringskassan/.github/actions/npm-release@main
        with:
          app-slug: ${{ steps.app-token.outputs.app-slug }}
          gh-token: ${{ steps.app-token.outputs.token }}
          config-preset: ${{ inputs.config-preset }}
          build-command: ${{ inputs.build-command }}
