name: Bundle Gradle Release

on:
  workflow_call:
    secrets:
      # Används inte längre. Kvar som valfria tills anropare slutat skicka dem.
      PACKAGES_RW_ACTOR:
        required: false
      PACKAGES_RW_TOKEN:
        required: false

jobs:
  call-gradle-release:
    uses: $/.github/workflows/gradle-release.yaml
  publish-release:
    needs: call-gradle-release
    uses: $/.github/workflows/publish-release-on-tag-push.yaml
