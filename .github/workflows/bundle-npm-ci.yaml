name: Bundle NPM CI

on: [workflow_call]

jobs:
  call-npm-ci:
    uses: $/.github/workflows/npm-ci.yaml
  call-npm-ghpages-docs:
    uses: $/.github/workflows/npm-ghpages-docs.yaml
  call-npm-lint:
    uses: $/.github/workflows/npm-lint.yaml
  call-pr-preview:
    uses: $/.github/workflows/npm-pr-preview.yaml
  call-pnr-scan:
    uses: $/.github/workflows/pnr-scanner.yaml
