name: Maven Release

# Akutfix: publicerar inte längre direkt till GitHub Packages.
# Artefakterna byggs och läggs i en lokal Maven-layout (staging),
# som laddas upp som workflow-artefakt. publish-release-on-tag-push.yaml
# lägger dem på GitHub Releasen, och Forsakringskassan/repository tar in
# dem med maven-intake.yaml

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      # Används inte längre. Kvar som valfria tills anropare slutat skicka dem.
      PACKAGES_RW_ACTOR:
        required: false
      PACKAGES_RW_TOKEN:
        required: false

jobs:
  maven-release:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ github.token }}
      VERSION: ${{ inputs.version }}

    steps:
      - name: Set paths
        run: |
          {
            echo "MAVEN_SETTINGS=$RUNNER_TEMP/maven/settings.xml"
            echo "STAGING_DIR=$RUNNER_TEMP/staging-repo"
            echo "STAGING_ARCHIVE=$RUNNER_TEMP/maven-staging.tar.gz"
            echo "VERSION_FILE=$RUNNER_TEMP/release-version.txt"
          } >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: "zulu"
          cache: 'maven'

      - name: Create Maven settings.xml
        run: |
          mkdir -p "$(dirname "$MAVEN_SETTINGS")"
          cat <<'EOF' > "$MAVEN_SETTINGS"
          <?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github--Forsakringskassan--repository</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Set version
        run: |
          ./mvnw -s "$MAVEN_SETTINGS" -ntp -T 1C versions:set -DnewVersion="$VERSION" -DprocessAllModules=true

      - name: Build and stage artifacts
        run: |
          ./mvnw -T 1C -s "$MAVEN_SETTINGS" -ntp deploy \
            -DaltDeploymentRepository="local::file://$STAGING_DIR"

      - name: Package staging
        run: |
          tar -czf "$STAGING_ARCHIVE" -C "$STAGING_DIR" .
          echo "$VERSION" > "$VERSION_FILE"
          echo "Innehåll i staging:"
          tar -tzf "$STAGING_ARCHIVE"

      - uses: actions/upload-artifact@v7
        with:
          name: maven-staging
          path: |
            ${{ env.STAGING_ARCHIVE }}
            ${{ env.VERSION_FILE }}
          if-no-files-found: error
          retention-days: 7
