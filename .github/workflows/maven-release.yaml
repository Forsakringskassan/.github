---
# INTERNAL building block -- not part of the public API.
# Repositories should call one of the bundle-*.yaml workflows instead.
# See docs/internals.md.
name: Maven Release

on:
  workflow_call:
    inputs:
      version:
        description: Version to set before deploying.
        required: true
        type: string
      java-version:
        description: Java version used to build.
        required: false
        type: string
        default: "25"
      java-distribution:
        description: Java distribution used to build.
        required: false
        type: string
        default: zulu
    secrets:
      PACKAGES_RW_ACTOR:
        required: true
      PACKAGES_RW_TOKEN:
        required: true

jobs:
  maven-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      # Credentials resolved by the generated settings.xml.
      MAVEN_USERNAME: ${{ secrets.PACKAGES_RW_ACTOR }}
      MAVEN_PASSWORD: ${{ secrets.PACKAGES_RW_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven

      - name: Create Maven settings.xml
        uses: Forsakringskassan/.github/actions/maven-settings@main

      - name: Git User
        run: |
          git config --global user.name "Github Actions"
          git config --global user.email "nobody@fk.se"
          git remote set-url origin \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Set version
        run: |
          ./mvnw -s "$MAVEN_SETTINGS" -ntp -T 1C \
            versions:set -DnewVersion=${{ inputs.version }} -DprocessAllModules=true

      - name: Publish with Maven
        run: |
          ./mvnw -T 1C -s "$MAVEN_SETTINGS" -ntp package deploy
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PACKAGES_RW_ACTOR: ${{ secrets.PACKAGES_RW_ACTOR }}
          PACKAGES_RW_TOKEN: ${{ secrets.PACKAGES_RW_TOKEN }}
