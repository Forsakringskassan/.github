---
# INTERNAL building block -- not part of the public API.
# Repositories should call one of the bundle-*.yaml workflows instead.
# See docs/internals.md.
name: Maven CI

on:
  workflow_call:
    inputs:
      java-version:
        description: Java version used to build.
        required: false
        type: string
        default: "25"
      java-distribution:
        description: Java distribution used to build.
        required: false
        type: string
        default: zulu
      maven-goals:
        description: Goals passed to Maven.
        required: false
        type: string
        default: verify
    secrets:
      PACKAGES_RW_ACTOR:
        required: true
      PACKAGES_RW_TOKEN:
        required: true

jobs:
  build-java:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read
    env:
      skip-automatic-fk-code-standard-apply: true
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Credentials resolved by the generated settings.xml.
      MAVEN_USERNAME: ${{ github.actor }}
      MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "0"

      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ inputs.java-distribution }}
          java-version: ${{ inputs.java-version }}
          cache: maven

      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache-v1

      - name: Create Maven settings.xml
        uses: Forsakringskassan/.github/actions/maven-settings@main

      - name: Maven build
        shell: bash
        run: |
          java -version
          javac -version
          ./mvnw -T 1C -s "$MAVEN_SETTINGS" -ntp ${{ inputs.maven-goals }}
        env:
          PACKAGES_RW_ACTOR: ${{ secrets.PACKAGES_RW_ACTOR }}
          PACKAGES_RW_TOKEN: ${{ secrets.PACKAGES_RW_TOKEN }}

      - name: Static code analysis to SARIF
        if: success() || failure()
        uses: Forsakringskassan/.github/actions/violations-to-sarif@main
        with:
          build-tool: maven

      - name: Publish Build
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-${{ github.run_number }}
          path: ${{ github.workspace }}
