#
# Använd bundle-maven-quarkus direkt istället!
# Har kvar den är bara för att inte behöva ändra så mycket.
#
name: Bundle Maven Release

on:
  workflow_call:
    secrets:
      # Används inte längre. Kvar som valfria tills anropare slutat skicka dem.
      PACKAGES_RW_ACTOR:
        required: false
      PACKAGES_RW_TOKEN:
        required: false

jobs:
  call-bundle-maven-quarkus-release:
    uses: $/.github/workflows/bundle-maven-quarkus-release.yaml
