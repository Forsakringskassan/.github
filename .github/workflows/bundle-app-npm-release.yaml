name: Bundle App NPM Release

on:
  workflow_call:
    secrets:
      # Används inte längre. Kvar som valfria tills anropare slutat skicka dem.
      PACKAGES_RW_ACTOR:
        required: false
      PACKAGES_RW_TOKEN:
        required: false

jobs:
  call-app-generic-conventional-release:
    if: |
      ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    uses: $/.github/workflows/generic-conventional-release.yaml
  call-app-npm-docker:
    needs: call-app-generic-conventional-release
    if: needs.call-app-generic-conventional-release.outputs.is-new-version == 'true'
    uses: $/.github/workflows/app-npm-docker.yaml
    with:
      version: ${{ needs.call-app-generic-conventional-release.outputs.current-version }}
      release: true
  call-npm-ghpages-app:
    if: needs.call-app-generic-conventional-release.outputs.is-new-version == 'true'
    uses: $/.github/workflows/npm-ghpages-app.yaml
  publish-release:
    if: needs.call-app-generic-conventional-release.outputs.is-new-version == 'true'
    needs: [call-app-generic-conventional-release, call-app-npm-docker]
    uses: $/.github/workflows/publish-release-on-tag-push.yaml
    with:
      version: ${{ needs.call-app-generic-conventional-release.outputs.current-version }}
