name: Bundle NPM Release

on:
  workflow_call:
    secrets:
      RELEASE_APP_KEY:
        required: true

jobs:
  call-npm-release:
    uses: $/.github/workflows/npm-release.yaml
    secrets:
      RELEASE_APP_KEY: ${{ secrets.RELEASE_APP_KEY }}
  call-npm-ghpages-docs:
    uses: $/.github/workflows/npm-ghpages-docs.yaml
  call-npm-lint:
    uses: $/.github/workflows/npm-lint.yaml
