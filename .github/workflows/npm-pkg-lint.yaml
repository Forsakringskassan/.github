---
# INTERNAL building block -- not part of the public API.
# Repositories should call one of the bundle-*.yaml workflows instead.
# See docs/internals.md.
name: NPM PKG Lint

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to run npm-pkg-lint with.
        required: false
        type: string
        default: 24.x
      folders:
        description: >-
          Space separated list of package folders to check, e.g. `packages/*`.
          The default `.` checks the repository root package.
        required: false
        type: string
        default: "."
      allow-dependencies:
        description: >-
          Comma separated list of dependencies npm-pkg-lint should not complain
          about.
        required: false
        type: string
        default: ""
      build:
        description: >-
          npm script npm-pkg-lint runs before packing, or "false" to skip it
          (for repositories that need a non-standard build, see
          `pre-build-command`).
        required: false
        type: string
        default: build
      pre-build-command:
        description: Command run before npm-pkg-lint. Skipped when empty.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  npm-pkg-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Pre-build
        if: inputs.pre-build-command != ''
        run: ${{ inputs.pre-build-command }}

      - name: npm-pkg-lint
        uses: ext/npm-pkg-lint@v5.3.0
        with:
          build: ${{ inputs.build }}
          folders: ${{ inputs.folders }}
          allow-dependencies: ${{ inputs.allow-dependencies }}
