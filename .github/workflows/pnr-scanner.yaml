---
# INTERNAL building block -- not part of the public API.
# Repositories should call one of the bundle-*.yaml workflows instead.
# Need this as a step inside an existing job? Use the composite action
# Forsakringskassan/.github/actions/pnr-scan instead. See docs/internals.md.
name: PNR Scan

on:
  workflow_call:
    inputs:
      path:
        description: Path to scan.
        required: false
        type: string
        default: "."

permissions:
  contents: read

jobs:
  pnr-scan:
    name: PNR Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Cache npm packages
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-pnr-scanner
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: pnr-scanner
        uses: Forsakringskassan/.github/actions/pnr-scan@main
        with:
          path: ${{ inputs.path }}
