name: Bundle App NPM CI

on:
  workflow_call:
    secrets:
      PACKAGES_RW_ACTOR:
        required: true
      PACKAGES_RW_TOKEN:
        required: true

jobs:
  call-npm-ci:
    uses: $/.github/workflows/npm-ci.yaml
  call-app-npm-docker:
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    needs: call-npm-ci
    uses: $/.github/workflows/app-npm-docker.yaml
    with:
      release: false
      version: snapshot
    secrets:
      PACKAGES_RW_ACTOR: ${{ secrets.PACKAGES_RW_ACTOR }}
      PACKAGES_RW_TOKEN: ${{ secrets.PACKAGES_RW_TOKEN }}
  call-npm-ghpages-app:
    needs: call-app-npm-docker
    if: ${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    uses: $/.github/workflows/npm-ghpages-app.yaml
  call-pnr-scan:
    uses: $/.github/workflows/pnr-scanner.yaml
