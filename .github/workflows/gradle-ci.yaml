name: Gradle CI

on:
  workflow_call:
    secrets:
      # Används inte längre. Kvar som valfria tills alla anropare slutat skicka dem.
      PACKAGES_RW_ACTOR:
        required: false
      PACKAGES_RW_TOKEN:
        required: false

jobs:
  build-gradle:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
      packages: read
    env:
      skip-automatic-fk-code-standard-apply: true
      # Gradle läser ORG_GRADLE_PROJECT_* som egenskaper. build.gradle och
      # gradle-conventions använder findProperty("GITHUB_ACTOR"/"GITHUB_TOKEN")
      # före PAT:en, så läsning från Forsakringskassan/repository sker med GITHUB_TOKEN.
      ORG_GRADLE_PROJECT_GITHUB_ACTOR: ${{ github.actor }}
      ORG_GRADLE_PROJECT_GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: "1"
      - name: Setup java
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "25"
          cache: 'gradle'
      - name: Cache npm
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-cache-v1
      - name: prepare Gradle
        shell: bash
        run: |
          mkdir -p ~/.gradle && echo "org.gradle.daemon=false" >> ~/.gradle/gradle.properties
      - name: Check formatting
        shell: bash
        run: |
          ./gradlew --no-daemon spotlessJavaCheck
      - name: "Gradle build"
        shell: bash
        run: |
          java -version
          javac -version
          ./gradlew --no-daemon build

      - name: Transorm static code analysis to SARIF
        if: ${{ (success() || failure()) }}
        run: |
          npx violations-command-line -sarif sarif-report.json \
          -v "FINDBUGS" "." ".*build/reports/spotbugs/main\.xml$" "Spotbugs" \
          -v "CHECKSTYLE" "." ".*build/reports/checkstyle/main\.xml$" "Checkstyle" \
          -v "PMD" "." ".*build/reports/pmd/main\.xml$" "PMD" \
          -v "JUNIT" "." ".*/build/test-results/test/TEST-.*\.xml$" "JUNIT"
      - uses: github/codeql-action/upload-sarif@v4
        if: ${{ (success() || failure()) }}
        with:
          sarif_file: sarif-report.json
          category: violations-lib

      - name: Publish Build
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: build-${{ github.run_number }}
          path: ${{ github.workspace }}
