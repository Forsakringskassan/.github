---
# INTERNAL building block -- not part of the public API.
# Repositories should call one of the bundle-*.yaml workflows instead.
# See docs/internals.md.
name: Build Quarkus app into Docker image

on:
  workflow_call:
    inputs:
      version:
        description: Version to set on the artifact and tag the image with.
        required: true
        type: string
      release:
        description: >-
          Push the `<version>` and `latest` tags in addition to `snapshot`.
        required: true
        type: boolean
      registry:
        description: Container registry to push to.
        required: false
        type: string
        default: ghcr.io
      java-version:
        description: Java version used to build the app.
        required: false
        type: string
        default: "25"
      java-distribution:
        description: Java distribution used to build the app.
        required: false
        type: string
        default: temurin
    secrets:
      PACKAGES_RW_ACTOR:
        required: true
      PACKAGES_RW_TOKEN:
        required: true

jobs:
  build-and-push-docker:
    runs-on: ubuntu-latest
    env:
      MAVEN_USERNAME: ${{ secrets.PACKAGES_RW_ACTOR }}
      MAVEN_PASSWORD: ${{ secrets.PACKAGES_RW_TOKEN }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          java-version: ${{ inputs.java-version }}
          distribution: ${{ inputs.java-distribution }}
          cache: maven

      - name: Create Maven settings.xml
        uses: Forsakringskassan/.github/actions/maven-settings@main

      - name: Get artifact info
        id: artifact
        run: |
          set -euo pipefail
          artifact_id=$(./mvnw -s "$MAVEN_SETTINGS" -ntp \
            help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          echo "name=$artifact_id" >> "$GITHUB_OUTPUT"
          echo "Artifact ID: $artifact_id"

      - name: Build project
        run: |
          set -euo pipefail
          ./mvnw -s "$MAVEN_SETTINGS" -ntp -T 1C \
            versions:set -DnewVersion=${{ inputs.version }}
          ./mvnw -s "$MAVEN_SETTINGS" -ntp -T 1C clean package -DskipTests

      - name: Prepare Docker context
        run: |
          set -euo pipefail
          mkdir docker
          # The Quarkus fast-jar directory is named after the artifact, so
          # find it rather than assuming a name.
          quarkus_app_dir=$(find target -name "*-app" -type d | head -1)
          if [ -z "$quarkus_app_dir" ]; then
            echo "::error::No Quarkus app directory found in target/"
            exit 1
          fi
          echo "Found Quarkus app: $quarkus_app_dir"
          cp -r "$quarkus_app_dir" docker/app

          cat > docker/Dockerfile <<'EOF'
          FROM eclipse-temurin:25-jre

          ENV LANGUAGE='en_US:en'

          COPY app/lib/ /deployments/lib/
          COPY app/*.jar /deployments/
          COPY app/app/ /deployments/app/
          COPY app/quarkus/ /deployments/quarkus/

          ARG NEXT_VERSION
          ARG GIT_COMMIT
          ARG IMAGE_NAME
          ARG BUILD_DATE
          ENV NEXT_VERSION=$NEXT_VERSION
          ENV GIT_COMMIT=$GIT_COMMIT
          ENV IMAGE_NAME=$IMAGE_NAME
          ENV BUILD_DATE=$BUILD_DATE

          USER 185
          EXPOSE 8080

          ENTRYPOINT ["sh", "-c", "echo \"Starting container: $IMAGE_NAME\" && echo \"Version: $NEXT_VERSION\" && echo \"Commit: $GIT_COMMIT\" && echo \"Build date: $BUILD_DATE\" && echo \"\" && exec java -jar /deployments/quarkus-run.jar"]
          EOF

      - name: Log in to registry
        run: |
          echo "${{ secrets.PACKAGES_RW_TOKEN }}" \
            | docker login "${{ inputs.registry }}" \
                -u "${{ secrets.PACKAGES_RW_ACTOR }}" --password-stdin

      - name: Build and push image
        uses: Forsakringskassan/.github/actions/docker-build-push@main
        with:
          image: >-
            ${{ inputs.registry }}/forsakringskassan/${{ steps.artifact.outputs.name }}
          version: ${{ inputs.version }}
          release: ${{ inputs.release }}
          context: docker
          description: "Quarkus application: ${{ steps.artifact.outputs.name }}"
