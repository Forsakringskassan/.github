---
# PUBLIC API -- other repositories call this workflow. Changing its inputs,
# secrets or job names is a breaking change for them. See ../../README.md.
name: Bundle npm lib CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON array of Node.js versions to build and test with.
        required: false
        type: string
        default: '["22.x", "24.x"]'
      npm-versions:
        description: >-
          JSON array of npm versions to additionally build and test with, on
          top of the npm bundled with Node.js. An empty array skips the job.
        required: false
        type: string
        default: "[]"
      runs-on:
        description: JSON array of runner labels to build and test on.
        required: false
        type: string
        default: '["ubuntu-latest"]'
      npm-pkg-lint-folders:
        description: Space separated folders to run npm-pkg-lint in.
        required: false
        type: string
        default: "."
      npm-pkg-lint-allow-dependencies:
        description: >-
          Comma separated dependencies npm-pkg-lint should accept even though
          it would normally reject them.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.runner }}, node ${{ matrix.node-version }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runs-on) }}
        node-version: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up
        uses: Forsakringskassan/.github/actions/npm-setup@main
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build
        uses: Forsakringskassan/.github/actions/npm-build@main

  build-npm:
    name: Build (npm ${{ matrix.npm-version }})
    if: inputs.npm-versions != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        npm-version: ${{ fromJSON(inputs.npm-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up
        uses: Forsakringskassan/.github/actions/npm-setup@main
        with:
          npm-version: ${{ matrix.npm-version }}

      - name: Build
        uses: Forsakringskassan/.github/actions/npm-build@main

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up
        uses: Forsakringskassan/.github/actions/npm-setup@main

      - name: Lint
        uses: Forsakringskassan/.github/actions/npm-lint@main
        with:
          npm-pkg-lint-folders: ${{ inputs.npm-pkg-lint-folders }}
          npm-pkg-lint-allow-dependencies: >-
            ${{ inputs.npm-pkg-lint-allow-dependencies }}
